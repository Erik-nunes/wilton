<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garanta sua Vaga</title>
    <!-- Use DS fonts: Montserrat and Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,"> <!-- prevent favicon request -->
</head>
<body>
    <main class="form-container">
        <div class="card">
            <header class="card-header">
                <h1>Preencha o formulário abaixo e garanta sua vaga</h1>
                <div class="warning-box">
                    <p><strong>Atenção:</strong> Preencha corretamente seus dados para garantir sua participação.</p>
                </div>
            </header>

            <form action="#" method="POST" class="capture-form">
                <div class="input-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>

                <div class="input-group">
                    <label for="whatsapp">WhatsApp</label>
                    <input type="tel" id="whatsapp" name="whatsapp" placeholder="(11) 99999-9999" required maxlength="15">
                </div>

                <div class="input-group">
                    <label for="empresa">Empresa</label>
                    <input type="text" id="empresa" name="empresa" placeholder="Nome da sua empresa" required>
                </div>

                <div class="checkbox-group">
                    <label class="custom-checkbox">
                        <input type="checkbox" name="comunicados">
                        <span class="checkmark"></span>
                        <span class="text">Concordo em receber convites, avisos e comunicados do Wilton por E-mail/SMS/WhatsApp</span>
                    </label>
                    
                    <label class="custom-checkbox">
                        <input type="checkbox" name="grupos">
                        <span class="checkmark"></span>
                        <span class="text">Aceito receber convites para grupos de WhatsApp do Wilton</span>
                    </label>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">GARANTIR MINHA VAGA</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
